name: wheelo
description: Wheelo - Multi-tenant Automobile Dealer Management (Desktop-first client)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # state management
  provider: ^6.1.2

  # networking (backend integration comes later)
  dio: ^5.5.0

  # secure token storage (works on desktop + mobile)
  flutter_secure_storage: ^9.2.2

  # ui
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # desktop window control (no-op on mobile builds)
  window_manager: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
